# Config for testing the SCEPTRE module against a local bennu field device VM
#
# scripts/run-bennu-vm.sh pull bennu.qc2
# scripts/run-bennu-vm.sh start bennu.qc2 examples/devices/sceptre/ep/dnp3-server.xml ./bennu-vm
# peat pull -d sceptre -i 127.0.0.1 --assume-online -v -c ./examples/peat-config-sceptre-testing.yaml
# scripts/run-bennu-vm.sh stop ./bennu-vm

metadata:
  name: "sceptre-test-config"
  description: "Config for testing SCEPTRE module FTP functionality against a local bennu VM"
  author: "cegoes"
  created: "March 14th, 2022"
  updated: "October 26th, 2026"

no_logo: true

hosts:
  - label: "localhost sceptre"
    identifiers:
      ip: 127.0.0.1
      hostname: "localhost"
    peat_module: "SCEPTRE"
    options:
      ftp:
        port: 2121
        user: sceptre
        pass: sceptre
