name: Build

on:
  push:
    branches:  # don't build on tags
  pull_request:
  workflow_dispatch:
  workflow_call:  # from release.yml
    inputs:
      version:
        description: "Version to stamp into the built artifacts and docs, e.g. v2026.9.2. Defaults to the version derived from the latest reachable Git tag."
        required: false
        type: string

permissions:
  contents: read

env:
  # The release workflow builds the artifacts *before* it creates the release
  # tag, so the SCM-derived version would be the previous release. Stamp the
  # requested version instead. This is empty for normal builds, which
  # pdm-backend, docs/conf.py, and update_file_version_info.py treat as unset.
  PDM_BUILD_SCM_VERSION: ${{ inputs.version }}

jobs:
  docs:
    name: Build Documentation (HTML and manpage)
    runs-on: ubuntu-24.04
    steps:
      # This will block outbound connections that aren't explicitly allowed
      # If this causes a pipeline to fail, investigate what endpoints were blocked.
      # If they are legitimate, then change to audit mode, run pipeline and collect
      # endpoints from StepSecurity report, update list of endpoints, then change back
      # to "block".
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pdm-project.org:443
            pdm.fming.dev:443
            pypi.org:443
            raw.githubusercontent.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
            fetch-tags: true
            fetch-depth: 0  # checkout full history
      # NOTE: awalsh128/cache-apt-pkgs-action was failing with cache failures
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          dot -V
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: "3.12"
          cache: true
      - name: Install dependencies
        run: pdm sync -d --clean
      # NOTE: this also regenerates docs/dependencies_table.rst ("pdm run dep-doc")
      - name: Build docs (HTML and manpage)
        run: pdm run docs
      - name: Upload HTML docs artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peat_docs
          path: _docs_html/**/*
      - name: Upload manpage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manpage
          path: _docs_man/peat.1

  python-build:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pdm-project.org:443
            pdm.fming.dev:443
            pypi.org:443
            raw.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-tags: true
          fetch-depth: 0  # checkout full history
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: "3.12"
          cache: true
      - name: Install dependencies
        run: pdm sync
      - name: Build Python package
        run: pdm build
      - name: Ensure package files exist
        run: |
          ls -lAhS dist
          ls -lA dist | grep py3-none-any.whl
          ls -lA dist | grep .tar.gz
      - name: List files in wheel
        run: pdm run python -m zipfile --list dist/*.whl
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python_package
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  linux-build:
    name: Build Linux Executables
    # NOTE: ubuntu-24 needed for python3.12
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-tags: true
          fetch-depth: 0  # checkout full history
      - name: Install apt dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: python3-dev python3-pip patchelf binutils scons libpq-dev libpq5
      # For some reason setup-pdm action isn't playing nice with PyInstaller,
      # have to manually do the install here
      - name: Install tool dependencies
        run: |
          python3 --version
          python3 -m pip --version
          pip install -U pdm
          pdm config check_update false
          pdm --version
      # NOTE: Pip is needed to manually reinstall psycopg2
      - name: Install Python packages (venv)
        run: |
          pdm sync -G exe
          pdm run python -m ensurepip
      - name: Build executable
        run: pdm run build-linux-exe
      - name: List executable contents
        run: pdm run inspect-exe
      - name: Check executable
        run: |
          ls -lAht dist/
          ./dist/peat --help
          ./dist/peat --version
          ./dist/peat parse --list-modules
          ./dist/peat parse -vVV -d AwesomeTool -I examples/example_peat_module/ -- examples/example_peat_module/awesome_output.json
      - name: Build Sneakypeat executable
        run: pdm run build-linux-sneakypeat
      - name: List Sneakypeat executable contents
        run: pdm run pyi-archive_viewer --list build/sneakypeat-pyinstaller-pre-staticx
      - name: Check Sneakypeat executable
        run: |
          ls -lAht dist/
          ./dist/sneakypeat --help
          ./dist/sneakypeat --scan localhost
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux_exe
          path: |
            dist/peat
            dist/sneakypeat
          if-no-files-found: error

  windows-build:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-tags: true
          fetch-depth: 0  # checkout full history
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: "3.12"
          cache: true
      - name: Install dependencies
        run: pdm sync -G exe
      - name: Update version info metadata for executable
        run: pdm run python .\distribution\update_file_version_info.py
      - name: Build executable
        run: pdm run build-exe
      - name: List executable contents
        run: pdm run pyi-archive_viewer --list dist/peat.exe
      - name: Check executable
        shell: bash
        run: |
          ./dist/peat.exe --version
          ./dist/peat.exe --help
          ./dist/peat.exe parse --list-modules
          ./dist/peat.exe parse -vVV -d AwesomeTool -I examples/example_peat_module/ -- examples/example_peat_module/awesome_output.json
      - name: Build Sneakypeat executable
        run: pdm run build-sneakypeat
      - name: Check Sneakypeat executable
        shell: bash
        run: |
          ./dist/sneakypeat.exe --version
          ./dist/sneakypeat.exe --help
          ./dist/sneakypeat.exe --scan -v localhost
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows_exe
          path: |
            dist/peat.exe
            dist/sneakypeat.exe
          if-no-files-found: error

  macos-build:
    name: Build macOS Executable (${{ matrix.arch }})
    # Build on the oldest tested macOS release so the executable runs on it and newer releases
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - platform: macos-15
            arch: arm64
          - platform: macos-15-intel
            arch: x86_64
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-tags: true
          fetch-depth: 0  # checkout full history
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: "3.12"
          cache: true
      - name: Install dependencies
        run: pdm sync -G exe
      - name: Build executable
        run: pdm run build-exe
      - name: List executable contents
        run: pdm run pyi-archive_viewer --list dist/peat
      - name: Check executable
        run: |
          file dist/peat
          file dist/peat | grep -q "${{ matrix.arch }}"
          ./dist/peat --version
          ./dist/peat --help
          ./dist/peat parse --list-modules
          ./dist/peat parse -vVV -d AwesomeTool -I examples/example_peat_module/ -- examples/example_peat_module/awesome_output.json
          mv dist/peat "dist/peat_macos_${{ matrix.arch }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos_exe_${{ matrix.arch }}
          path: dist/peat_macos_${{ matrix.arch }}
          if-no-files-found: error

  # Run the Windows executables built above on each Windows version tested in CI.
  # windows-11-arm runs the x64 executables under emulation, like ARM-based Windows 11 PCs do.
  windows-exe-test:
    name: Test Windows Executables
    needs: windows-build
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ["windows-2022", "windows-2025", "windows-11-arm"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Download executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows_exe
          path: dist
      - name: Show Windows version
        run: |
          Get-ComputerInfo -Property OsName, OsVersion, OsBuildNumber, OsArchitecture
          $env:PROCESSOR_ARCHITECTURE
      # bash stops on the first command that fails, PowerShell only checks the last one
      - name: Check executable
        shell: bash
        run: |
          ./dist/peat.exe --version
          ./dist/peat.exe --help
          ./dist/peat.exe parse --list-modules
          ./dist/peat.exe parse -vVV -d AwesomeTool -I examples/example_peat_module/ -- examples/example_peat_module/awesome_output.json
      # 127.0.0.1 skips the online check entirely, and runners are Administrator
      # so PEAT would use ARP/ICMP, so force a TCP SYN check of another loopback address
      - name: Check host discovery (TCP SYN to loopback)
        shell: bash
        env:
          PEAT_FORCE_ONLINE_METHOD_TCP: "true"
        run: |
          ./dist/peat.exe scan -i 127.0.0.2 --sweep -q --print-results | tee sweep.json
          grep -A1 '"hosts_online"' sweep.json | grep -q '127.0.0.2'
      - name: Check Sneakypeat executable
        shell: bash
        run: |
          ./dist/sneakypeat.exe --version
          ./dist/sneakypeat.exe --scan -v localhost
