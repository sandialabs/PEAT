name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release, e.g. v2026.8.31"
        required: true
        type: string
      target_branch:
        description: "Branch to release from"
        required: true
        default: "main"
        type: string
      release_title:
        description: "Optional release title"
        required: false
        type: string

permissions: read-all

concurrency:
  group: release-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build artifacts
    uses: ./.github/workflows/build.yml

  check-changelog:
    name: Check ChangeLog
    needs: [test, build]
    permissions: read-all
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
    outputs:
      already_updated: ${{ steps.changelog_check.outputs.already_updated }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            pdm-project.org:443
            pdm.fming.dev:443
            pypi.org:443
            files.pythonhosted.org:443
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: 
            persist-credentials: true
            fetch-depth: 0
            ref: ${{ inputs.target_branch }}
      - name: Check whether changelog was already updated
        id: changelog_check
        shell: bash
        run: |
          set -euo pipefail

          already_updated=false

          if awk -v tag="$TAG_NAME" '
            index($0, tag) == 1 {
              rest = substr($0, length(tag) + 1)
              if (rest ~ /^[[:space:]]*\(/) {
                found = 1
              }
            }
            END {
              exit(found ? 0 : 1)
            }
          ' CHANGELOG.rst; then
            already_updated=true
          fi

          echo "already_updated=$already_updated" >> "$GITHUB_OUTPUT"

          if [[ "$already_updated" == "true" ]]; then
            echo "Changelog already contains entry for $TAG_NAME; skipping changelog commit."
          else
            echo "Changelog does not contain entry for $TAG_NAME; changelog update is needed."
          fi

  update-changelog:
    name: Update ChangeLog
    needs: [test, build, check-changelog]
    if: ${{ needs.check-changelog.outputs.already_updated == 'false' }}
    permissions:
      id-token: write
      contents: write
      discussions: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            pdm-project.org:443
            pdm.fming.dev:443
            pypi.org:443
            files.pythonhosted.org:443
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: 
            persist-credentials: true
            fetch-depth: 0
            ref: ${{ inputs.target_branch }}
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: "3.12"
          cache: true
      - name: Install dependencies
        run: pdm sync -G towncrier
      - name: Build changelog to commit
        shell: bash
        run: |
          pdm run towncrier build --version "$TAG_NAME" --yes

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.rst

          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi

          git commit -m "docs: Updated CHANGELOG for tag $TAG_NAME [skip ci]

          Triggered-by: ${{ github.actor }}"
          git push

  create-tag:
    name: Create Tag
    needs: [test, build, check-changelog, update-changelog]
    # update-changelog is optional if there is nothing to do
    if: >-
      ${{
        always() &&
        needs.test.result == 'success' &&
        needs.build.result == 'success' &&
        needs.check-changelog.result == 'success' &&
        (
          needs.update-changelog.result == 'success' ||
          needs.update-changelog.result == 'skipped'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      discussions: write
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: auditxx
      - name: Validate tag name
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TAG_NAME" == -* ]]; then
            echo "Tag name must not start with '-'."
            exit 1
          fi

          if ! git check-ref-format "refs/tags/$TAG_NAME"; then
            echo "Invalid Git tag name: $TAG_NAME"
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}
      - name: Create tag if needed
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "Tag $TAG_NAME already exists."
            exit 0
          else
            echo "Creating Tag $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME

            Triggered-by: ${{ github.actor }}"
            git push origin "refs/tags/$TAG_NAME"
          fi

  create-release:
    name: Build and publish GitHub release
    needs: [test, build, check-changelog, update-changelog, create-tag]
    # update-changelog is optional if there is nothing to do
    if: >-
      ${{
        always() &&
        needs.test.result == 'success' &&
        needs.build.result == 'success' &&
        needs.check-changelog.result == 'success' &&
        (
          needs.update-changelog.result == 'success' ||
          needs.update-changelog.result == 'skipped'
        ) &&
        needs.create-tag.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      discussions: write
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      RELEASE_TITLE: ${{ inputs.release_title }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            raw.githubusercontent.com:443
            pdm-project.org:443
            pdm.fming.dev:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            packages.microsoft.com:443
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: 
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: List files
        run: |
          ls -lAht ./
          ls -lAht ./linux_exe
          ls -lAht ./windows_exe
          ls -lAht ./peat_docs
          ls -lAht ./manpage
          ls -lAht ./python_package
      - name: Mark files executable
        run: |
          chmod +x linux_exe/*
          chmod +x windows_exe/*
      - name: Create Linux release bundle
        run: |
          mkdir peat_linux
          cp distribution/linux-install-script.sh peat_linux
          cp examples/peat-config.yaml peat_linux/
          cp examples/peat-config-simple.yaml peat_linux/
          cp manpage/peat.1 peat_linux/
          cp linux_exe/peat peat_linux/
          ls -lAht peat_linux/
          tar -czf "peat_linux_${{ env.TAG_NAME }}.tgz" peat_linux/
      - name: Create Windows release bundle
        run: |
          mkdir peat_windows
          cp examples/peat-config.yaml peat_windows/
          cp examples/peat-config-simple.yaml peat_windows/
          cp windows_exe/peat.exe peat_windows/
          ls -lAht peat_windows/
          zip -r "peat_windows_${{ env.TAG_NAME }}.zip" peat_windows/
      - name: Zip up HTML docs
        run: |
          cp manpage/peat.1 peat_docs/
          zip -r peat_docs.zip peat_docs/
      - name: Verify release files exist
        shell: bash
        run: |
          set -euo pipefail

          echo "TAG_NAME=$TAG_NAME"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "Current directory:"
          pwd

          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort

          test -f "peat_linux_${TAG_NAME}.tgz"
          test -f "peat_windows_${TAG_NAME}.zip"
          test -f "peat_docs.zip"
          test -f "linux_exe/peat"
          test -f "windows_exe/peat.exe"
      # NOTE: This will trigger the Docker workflow
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        id: create-release
        with:
          prerelease: ${{ endsWith(env.TAG_NAME, '-prerelease') }}
          fail_on_unmatched_files: true
          discussion_category_name: Announcements
          generate_release_notes: true
          preserve_order: true
          files: |
            linux_exe/peat
            windows_exe/peat.exe
            peat_linux_${{ env.TAG_NAME }}.tgz
            peat_windows_${{ env.TAG_NAME }}.zip
            peat_docs.zip
            manpage/peat.1
            python_package/*.whl
            python_package/*.tar.gz
            linux_exe/sneakypeat
            windows_exe/sneakypeat.exe
          draft: true
          name: "${{ env.TAG_NAME }}"
          tag_name: ${{ env.TAG_NAME }}