name: Create Releases

on:
  push:
    tags:
      - 'v*.*.*'  # tags such as v1.2.3
      - 'v*.*.*-prerelease'  # tags such as v1.2.3

permissions: read-all

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build artifacts
    uses: ./.github/workflows/build.yml

  create-release:
    name: Build and publish GitHub release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      discussions: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            pdm-project.org:443
            pdm.fming.dev:443
            pypi.org:443
            files.pythonhosted.org:443
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: 
            persist-credentials: true
            fetch-depth: 0
            ref: main
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: "3.12"
          cache: true
      - name: Install dependencies
        run: pdm sync -G towncrier
      - name: Build draft changelog
        run: pdm run towncrier build --yes
      - name: Update CHANGELOG.rst & push
        run: |
          # GITHUB_REF is "refs/tags/v1.2.3", strip the prefix:
          TAG=${GITHUB_REF#refs/tags/}
          echo "- $TAG: automated release entry on $(date +'%Y-%m-%d')" >> ChangeLog.rst
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.rst
          git commit -m "docs: Updated CHANGELOG for tag $TAG [skip ci]"
          git push

      - name: Install apt dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: zip
      # Download all build artifacts to current directory
      # This also downloads test artifacts...oh well, it's a ergonomics issue with GitHub Actions
      # In GitLab CI, you'd just put what jobs to pull from and go home. But this isn't GitLab, sigh.
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: List files
        run: |
          ls -lAht ./
          ls -lAht ./linux_exe
          ls -lAht ./windows_exe
          ls -lAht ./peat_docs
          ls -lAht ./manpage
          ls -lAht ./python_package
      - name: Mark files executable
        run: |
          chmod +x linux_exe/*
          chmod +x windows_exe/*
      - name: Create Linux release bundle
        run: |
          mkdir peat_linux
          cp distribution/linux-install-script.sh peat_linux
          cp examples/peat-config.yaml peat_linux/
          cp examples/peat-config-simple.yaml peat_linux/
          cp manpage/peat.1 peat_linux/
          cp linux_exe/peat peat_linux/
          ls -lAht peat_linux/
          tar -czf "peat_linux_${{ github.ref_name }}.tgz" peat_linux/
      - name: Create Windows release bundle
        run: |
          mkdir peat_windows
          cp examples/peat-config.yaml peat_windows/
          cp examples/peat-config-simple.yaml peat_windows/
          cp windows_exe/peat.exe peat_windows/
          ls -lAht peat_windows/
          zip -r "peat_windows_${{ github.ref_name }}.zip" peat_windows/
      - name: Zip up HTML docs
        run: |
          cp manpage/peat.1 peat_docs/
          zip -r peat_docs.zip peat_docs/
      # TODO: body of release will come from CHANGELOG.rst
      # NOTE: This will trigger the Docker workflow
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        id: create-release
        with:
          # TODO: body
          # body: "tbd"
          # If tag ends with "-pre", then it's a prerelease
          prerelease: ${{ endsWith(github.ref_name, '-prerelease') }}
          fail_on_unmatched_files: true
          discussion_category_name: Announcements
          generate_release_notes: true
          preserve_order: true
          files: |
            linux_exe/peat
            windows_exe/peat.exe
            peat_linux_${{ github.ref_name }}.tgz
            peat_windows_${{ github.ref_name }}.zip
            peat_docs.zip
            manpage/peat.1
            python_package/*.whl
            python_package/*.tar.gz
            linux_exe/sneakypeat
            windows_exe/sneakypeat.exe
