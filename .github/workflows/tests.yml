name: Core Tests

on:
  push:
  pull_request:
  workflow_call:  # from release.yml

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    # Conventional Commits does not work on workflow_dispatch from release.yml
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - name: Conventional Commits
        uses: taskmedia/action-conventional-commits@e611e6d5471dc1853d7ab1642ed07c6abe28eb1d # v1.1.26
        with:
          types: >
            build|chore|ci|docs|doc|feat|fix|bug|minor|patch|perf|style|refactor|test|tests|revert|deps|dependencies|sec|security|deprecate

  check-newsfragments:
    name: Changelog Fragment Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0s
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: News Fragments Added
        shell: bash
        run: |
          set -euo pipefail
          
          PR_NUM=${{ github.event.pull_request.number }}

          # require at least one fragment file named PR.<category>
          if ! ls newsfragments/${PR_NUM}.* >/dev/null 2>&1; then
            echo "::error ::Missing newsfragment file: newsfragments/${PR_NUM}.*"
            echo "Please add at least one fragment (e.g. newsfragments/${PR_NUM}.feature or newsfragments/${PR_NUM}.bugfix) so towncrier can pick it up for the changelog. It's now required for all PRs, even minor changes."
            echo "Refer to the 'Update the CHANGELOG' section in CONTRIBUTING.rst"
            exit 1
          else
            echo -e "Found fragment(s):"
            ls newsfragments/${PR_NUM}.*
          fi

  # This verifies that the release.yml version will pass too
  check-changelog: 
    name: Changelog Construction Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0s
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            pdm-project.org:443
            pdm.fming.dev:443
            pypi.org:443
            files.pythonhosted.org:443
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: "3.12"
          cache: true
      - name: Install dependencies
        run: pdm sync -G towncrier
      - name: Build draft changelog
        run: pdm run towncrier build --draft

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pdm-project.org:443
            pdm.fming.dev:443
            pypi.org:443
            raw.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: "3.12"
          cache: true
      - name: Install dependencies
        run: pdm sync -G lint
      - name: Run Code Quality Checks
        run: |
          pdm run lint
          pdm run check-sdist --inject-junk

  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # OS images: https://github.com/actions/runner-images
      # Windows: windows-2022 (Windows Server 2022, build 20348) and windows-2025
      # (Windows Server 2025, build 26100, the same base as Windows 11 24H2).
      # windows-11-arm is the Windows 11 client OS. It runs x64 Python under
      # emulation, the same way peat.exe runs on ARM-based Windows 11 PCs.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        platform: ["ubuntu-24.04", "windows-2025", "windows-2022", "windows-11-arm", "macos-latest"]
        include:
          - platform: windows-11-arm
            architecture: x64
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache: true
      - name: Install dependencies
        run: pdm sync -G test
      - name: Run Unit Tests
        run: |
          pdm run pytest --basetemp=./pytest_files --run-slow --durations=10 --cov-report term-missing:skip-covered --cov-report html --cov=peat --no-cov-on-fail --xdoctest -n 8 ./tests ./peat
      # Mounting disk images with pillage requires root, so these tests are skipped
      # above. Run them as root, and fail if they're skipped instead of passing.
      - name: Run Linux Disk Image Tests (root)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-utils cryptsetup lvm2
          # The nbd kernel module isn't in the base modules package of some kernels
          if ! sudo modprobe --dry-run nbd; then
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
          fi
          sudo .venv/bin/python -m pytest -p no:cacheprovider --basetemp=/tmp/pytest_root --run-slow -v -rs -k test_pillage_image_linux_real tests/api/test_pillage_api.py 2>&1 | tee pytest_root.txt
          grep -q "1 passed" pytest_root.txt
      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-python${{ matrix.python-version }}-${{ matrix.platform }}
          path: |
            htmlcov/
            pytest_files/
          if-no-files-found: error

  # Single check that can be marked as required in branch protection,
  # instead of requiring each job and matrix entry individually.
  all-tests-passed:
    name: All Tests Passed
    if: always()
    needs: [commits, check-newsfragments, check-changelog, code-quality, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - name: Check results of required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error ::One or more required jobs failed or were cancelled"
            exit 1
          fi
