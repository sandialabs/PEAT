# OpenSSF Scorecard supply-chain security analysis.
# https://github.com/ossf/scorecard-action
# Results are published to the Security tab (code scanning) and to the
# public Scorecard API, which backs the badge in README.md.
name: OpenSSF Scorecard

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # To guarantee the Maintained check is occasionally updated.
  schedule:
    - cron: "30 1 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Results can only be published from the upstream repository's default branch.
    if: github.repository == 'sandialabs/PEAT'
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the public Scorecard API, enabling the README badge.
          publish_results: true
      # Upload the results as an artifact (optional, useful for debugging).
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      # Upload the results to GitHub's code scanning dashboard.
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@b20883b0cd1f46c72ae0ba6d1090936928f9fa30 # v4.32.0
        with:
          sarif_file: results.sarif
